



<main class="login-page">
    <mat-card class="login-card" appearance="outlined">
        <mat-card-header>
            <mat-card-title>Login</mat-card-title>
        </mat-card-header>
        <form [formGroup]="loginForm" (ngSubmit)="loginSubmit()">
            <mat-form-field appearance="outline">
                <mat-label>Username</mat-label>
                <input matInput formControlName="username"/>
                @if(loginForm.controls.username.touched && loginForm.controls.username.hasError('required')){
                    <mat-error>Username is required</mat-error>
                } 
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label>Password</mat-label>
                <input matInput formControlName="password"/>
                @if(loginForm.controls.password.touched && loginForm.controls.password.hasError('required')){
                    <mat-error>Password is required</mat-error>
                } 
            </mat-form-field>

             <button mat-flat-button type="submit" [disabled]="isSubmitting()">Submit</button>
                @if(loginError()){
                    <p class="login-error" role="alert">{{ loginError() }}</p>
                }
        </form> 
    </mat-card>
</main>
