

 
 <mat-toolbar color="primary">
   
    <span class="spacer">HDnet</span>

    <div class="profile">
      <span>Username</span>
      <button matButton="filled" (click)="signoutAccount()">Signout</button>
    </div>

 </mat-toolbar>

 @if (errorMsg()) {
   <p role="alert">{{ errorMsg() }}</p>
 }

 <div class="table-container">
    <table mat-table [dataSource]="dataSource()">

      <!-- OrderNumber Column -->
      <ng-container matColumnDef="orderNumber">
        <th mat-header-cell *matHeaderCellDef> orderNumber </th>
        <td mat-cell *matCellDef="let element"> {{element.orderNumber}} </td>
      </ng-container>

      <!-- OrderDate Column -->
      <ng-container matColumnDef="orderDate">
        <th mat-header-cell *matHeaderCellDef> orderDate </th>
        <td mat-cell *matCellDef="let element"> {{element.orderDate}} </td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> status </th>
        <td mat-cell *matCellDef="let element"> {{element.status}} </td>
      </ng-container>

      <!-- RXcount Column -->
      <ng-container matColumnDef="rxCount">
        <th mat-header-cell *matHeaderCellDef> rxCount </th>
        <td mat-cell *matCellDef="let element"> {{element.rxCount}} </td>
      </ng-container>
      <!-- Action Column -->
      <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef>
                <span class="visually-hidden">Actions</span>
              </th>
               <td mat-cell *matCellDef="let element">
                @if (canCancelOrder(element)) {
                  <button mat-button>Cancel</button>
                }
               </td>

      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns;sticky:true"></tr>
      <tr mat-row *matRowDef="let element; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length" style="text-align: center; padding: 24px;">
          No orders found.
        </td>
      </tr>
    </table>
  </div>
    <mat-paginator
          [length]="totalRecords()" 
          [pageIndex]="pageNumber()"
          [pageSize]="pageSize()"  
          [pageSizeOptions]="[25, 50, 100]" 
          (page)="onPageChange($event)"
          showFirstLastButtons
          aria-label="Select page of periodic elements">
    </mat-paginator>
